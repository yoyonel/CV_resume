version: '3'

vars:
  PYTHON_SCRIPTS: scripts/

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  # --- LINTING & CHECKING ---
  lint:
    desc: Run all linters and code/template checkers
    cmds:
      - task: lint:python
      - task: lint:types
      - task: lint:json
      - task: lint:jinja
      - task: lint:typst

  lint:python:
    desc: Lint Python scripts with ruff
    cmds:
      - uv run ruff check {{.PYTHON_SCRIPTS}}

  lint:types:
    desc: Type check Python scripts with pyright
    cmds:
      - uv run pyright {{.PYTHON_SCRIPTS}}

  lint:json:
    desc: Validate JSON syntax and structure
    cmds:
      - for f in data/*.json; do python3 -m json.tool "$f" > /dev/null; done
    silent: true

  lint:jinja:
    desc: Validate Jinja2 templates AST parsing
    cmds:
      - |
        uv run python -c '
        from jinja2 import Environment
        templates = [
            "pandoc_resume/resume.md.j2",
            "pandoc_resume/sections/00_header.md.j2",
            "typst_resume/resume.typ.j2",
            "site_template/index.html.j2",
        ]
        for t in templates:
            with open(t, "r", encoding="utf-8") as f:
                Environment().parse(f.read())
            print(f"  [OK] Jinja AST: {t}")
        '

  lint:typst:
    desc: Check and compile Typst template without errors
    cmds:
      - uv run scripts/compile_typst.py

  lint:markdown:
    desc: Lint Markdown files with markdownlint-cli2
    cmds:
      - npx markdownlint-cli2 "docs/*.md" "README.md"

  # --- FORMATTING ---
  fmt:
    desc: Format all code and documentation
    cmds:
      - task: fmt:python

  fmt:python:
    desc: Format Python scripts with ruff
    cmds:
      - uv run ruff format {{.PYTHON_SCRIPTS}}

  # --- WATCH & LIVE PREVIEW ---
  watch:
    desc: Live watch & instant Typst recompilation on source change
    cmds:
      - uv run scripts/watch_typst.py

  # --- STATIC SITE & GITHUB PAGES ---
  site:build:
    desc: Build static GitHub Pages site with Typst SVG/PDF
    cmds:
      - uv run scripts/build_site.py

  site:serve:
    desc: Start local HTTP preview server with auto-rebuild (http://localhost:8000)
    cmds:
      - uv run scripts/serve_site.py

  site:serve:lan:
    desc: Start local preview server on 0.0.0.0 for LAN / smartphone testing
    cmds:
      - uv run scripts/serve_site.py --lan

  # --- RESPONSIVE & MOBILE VALIDATION ---
  site:check:mobile:
    desc: Automated mobile responsiveness & zero-overflow validation with Playwright
    cmds:
      - uv run scripts/check_mobile.py

  check:mobile:
    desc: Alias for site:check:mobile
    cmds:
      - task: site:check:mobile

  # --- LINK VALIDATION ---
  links:check:
    desc: Check and validate all hyperlinks across static site, PDF and sources
    cmds:
      - uv run python3 scripts/check_links.py

  check:links:
    desc: Alias for links:check
    cmds:
      - task: links:check

  # --- PRE-COMMIT HOOKS ---
  pre-commit:install:
    desc: Install pre-commit git hooks
    cmds:
      - uv run pre-commit install

  pre-commit:run:
    desc: Run all pre-commit hooks manually on all files
    cmds:
      - uv run pre-commit run --all-files

  # --- LIGHTHOUSE PERFORMANCE AUDITS ---
  audit:local:
    desc: Run local Lighthouse audit (Mobile & Desktop) against dist/ (min threshold >= 80/100)
    cmds:
      - task: site:build
      - uv run python3 scripts/audit_lighthouse.py --serve dist --mode all {{.CLI_ARGS}}

  audit:local:mobile:
    desc: Run local Mobile Lighthouse audit against dist/ (min threshold >= 80/100)
    cmds:
      - task: site:build
      - uv run python3 scripts/audit_lighthouse.py --serve dist --mode mobile {{.CLI_ARGS}}

  audit:local:desktop:
    desc: Run local Desktop Lighthouse audit against dist/ (min threshold >= 80/100)
    cmds:
      - task: site:build
      - uv run python3 scripts/audit_lighthouse.py --serve dist --mode desktop {{.CLI_ARGS}}

  audit:prod:
    desc: Run Lighthouse audit (Mobile & Desktop) on PROD (https://yoyonel.github.io/CV_resume/)
    cmds:
      - uv run python3 scripts/audit_lighthouse.py --url https://yoyonel.github.io/CV_resume/ --mode all {{.CLI_ARGS}}

  audit:prod:mobile:
    desc: Run Mobile Lighthouse audit on PROD (https://yoyonel.github.io/CV_resume/)
    cmds:
      - uv run python3 scripts/audit_lighthouse.py --url https://yoyonel.github.io/CV_resume/ --mode mobile {{.CLI_ARGS}}

  audit:prod:desktop:
    desc: Run Desktop Lighthouse audit on PROD (https://yoyonel.github.io/CV_resume/)
    cmds:
      - uv run python3 scripts/audit_lighthouse.py --url https://yoyonel.github.io/CV_resume/ --mode desktop {{.CLI_ARGS}}

  tunnel:
    desc: Start Cloudflare Quick Tunnel on local dist/ for third-party remote testing (PageSpeed Insights, etc.)
    cmds:
      - uv run python3 scripts/tunnel.py

  site:check:console:
    desc: Automated runtime console and exception verification with Playwright
    cmds:
      - task: site:build
      - uv run scripts/check_console.py

  check:console:
    desc: Verify zero runtime exceptions or console errors
    cmds:
      - task: site:check:console

  site:check:html:
    desc: Automated static HTML and inline JavaScript syntax validation
    cmds:
      - task: site:build
      - uv run python3 scripts/check_html_syntax.py

  check:html:
    desc: Alias for site:check:html
    cmds:
      - task: site:check:html

  site:check:ui:
    desc: Automated UI regression verification (Ctrl K, search input, tooltip clipping, galleries)
    cmds:
      - task: site:build
      - uv run scripts/test_ui_regressions.py

  check:ui:
    desc: Verify zero UI layout regressions
    cmds:
      - task: site:check:ui

  site:check:print:
    desc: Automated @media print & PDF layout validation with Playwright
    cmds:
      - task: site:build
      - uv run python3 scripts/test_print_rendering.py {{.CLI_ARGS}}

  check:print:
    desc: Verify zero print layout regressions
    cmds:
      - task: site:check:print

  site:check:bot:
    desc: Run guided exploratory bot to test all app features, state transitions and track history
    cmds:
      - task: site:build
      - uv run scripts/exploratory_bot.py {{.CLI_ARGS}}

  test:bot:
    desc: Run guided exploratory bot on local build (e.g. task test:bot -- --steps 100 --seed 42)
    cmds:
      - task: site:build
      - uv run scripts/exploratory_bot.py {{.CLI_ARGS}}

  test:bot:prod:
    desc: Run guided exploratory bot on PROD (https://yoyonel.github.io/CV_resume/)
    cmds:
      - uv run scripts/exploratory_bot.py --url https://yoyonel.github.io/CV_resume/ {{.CLI_ARGS}}

  test:bot:surge:
    desc: Run guided exploratory bot on Surge Preview (pass URL=... or defaults to current PR preview)
    vars:
      SURGE_URL: '{{.URL | default "https://yoyonel-cv-resume-pr-10.surge.sh"}}'
    cmds:
      - uv run scripts/exploratory_bot.py --url {{.SURGE_URL}} {{.CLI_ARGS}}

  test:bot:preview:
    desc: Alias for test:bot:surge
    cmds:
      - task: test:bot:surge

  # --- ARCHITECTURE DECISION RECORDS (ADR) ---
  adr:new:
    desc: "Scaffold a new Architecture Decision Record (e.g. task adr:new -- 'My Decision Title')"
    cmds:
      - uv run python3 scripts/create_adr.py {{.CLI_ARGS}}

  adr:build:
    desc: "Build static HTML documentation for all ADRs using adr-viewer into dist/adr/index.html"
    cmds:
      - uv run python3 scripts/build_adr.py {{.CLI_ARGS}}

  adr:serve:
    desc: "Start interactive local preview of ADRs with automatic free port detection"
    cmds:
      - uv run python3 scripts/serve_adr.py {{.CLI_ARGS}}

  adr:list:
    desc: "List all Architecture Decision Records"
    cmds:
      - uv run python3 scripts/build_adr.py --list
    silent: true

  # --- VALIDATION SUITE ---
  check:
    desc: Full validation suite (lint + site build + html check + mobile check + console check + UI check + print check + link check)
    cmds:
      - task: lint
      - task: site:build
      - task: check:html
      - task: check:mobile
      - task: check:console
      - task: check:ui
      - task: check:print
      - task: links:check
      - echo "All checks passed successfully!"



