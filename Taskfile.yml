version: '3'

vars:
  PYTHON_SCRIPTS: scripts/

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  # --- LINTING & CHECKING ---
  lint:
    desc: Run all linters and code/template checkers
    cmds:
      - task: lint:python
      - task: lint:json
      - task: lint:jinja
      - task: lint:typst

  lint:python:
    desc: Lint Python scripts with ruff
    cmds:
      - ruff check {{.PYTHON_SCRIPTS}}

  lint:json:
    desc: Validate JSON syntax and structure
    cmds:
      - python3 -m json.tool data/profile.json > /dev/null
    silent: true

  lint:jinja:
    desc: Validate Jinja2 templates AST parsing
    cmds:
      - |
        uv run --with jinja2 python -c '
        from jinja2 import Environment
        templates = [
            "pandoc_resume/resume.md.j2",
            "pandoc_resume/sections/00_header.md.j2",
            "typst_resume/resume.typ.j2",
            "site_template/index.html.j2",
        ]
        for t in templates:
            with open(t, "r", encoding="utf-8") as f:
                Environment().parse(f.read())
            print(f"  [OK] Jinja AST: {t}")
        '

  lint:typst:
    desc: Check and compile Typst template without errors
    cmds:
      - uv run scripts/compile_typst.py

  lint:markdown:
    desc: Lint Markdown files with markdownlint-cli2
    cmds:
      - npx markdownlint-cli2 "docs/*.md" "README.md"

  # --- FORMATTING ---
  fmt:
    desc: Format all code and documentation
    cmds:
      - task: fmt:python

  fmt:python:
    desc: Format Python scripts with ruff
    cmds:
      - ruff format {{.PYTHON_SCRIPTS}}

  # --- WATCH & LIVE PREVIEW ---
  watch:
    desc: Live watch & instant Typst recompilation on source change
    cmds:
      - uv run scripts/watch_typst.py

  # --- STATIC SITE & GITHUB PAGES ---
  site:build:
    desc: Build static GitHub Pages site with Typst SVG/PDF
    cmds:
      - uv run scripts/build_site.py

  site:serve:
    desc: Start local HTTP preview server with auto-rebuild (http://localhost:8000)
    cmds:
      - uv run scripts/serve_site.py

  site:serve:lan:
    desc: Start local preview server on 0.0.0.0 for LAN / smartphone testing
    cmds:
      - uv run scripts/serve_site.py --lan

  # --- RESPONSIVE & MOBILE VALIDATION ---
  site:check:mobile:
    desc: Automated mobile responsiveness & zero-overflow validation with Playwright
    cmds:
      - uv run --with playwright scripts/check_mobile.py

  check:mobile:
    desc: Alias for site:check:mobile
    cmds:
      - task: site:check:mobile

  # --- LINK VALIDATION ---
  links:check:
    desc: Check and validate all hyperlinks across static site, PDF and sources
    cmds:
      - python3 scripts/check_links.py

  check:links:
    desc: Alias for links:check
    cmds:
      - task: links:check

  # --- PRE-COMMIT HOOKS ---
  pre-commit:install:
    desc: Install pre-commit git hooks
    cmds:
      - pre-commit install

  pre-commit:run:
    desc: Run all pre-commit hooks manually on all files
    cmds:
      - pre-commit run --all-files

  # --- VALIDATION SUITE ---
  check:
    desc: Full validation suite (lint + site build + mobile check + link check)
    cmds:
      - task: lint
      - task: site:build
      - task: check:mobile
      - task: links:check
      - echo "All checks passed successfully!"

