name: build-pdf-cv_resume

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  build-pdf:
    name: Build PDF CV Resume
    runs-on: ubuntu-latest
    steps:
      - name: "Set current date as env variable"
        run: |
          echo "builddate=$(date +'%Y')" >> $GITHUB_OUTPUT
        id: version
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Run the build process with docker
        uses: addnab/docker-run-action@v3
        with:
          image: yoyonel/pandoc:latest
          options: -v ${{ github.workspace }}:/source
          run: |
            cd /source/pandoc_resume
            make pdf
      - name: rename builds
        run: |
          cp pandoc_resume/resume.pdf "${{ steps.version.outputs.builddate }}_ATTY_Resume.pdf"
          cp pandoc_resume/references.pdf "${{ steps.version.outputs.builddate }}_ATTY_References.pdf"
      - name: Publishing Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.builddate }}-resume
          name: ${{ steps.version.outputs.builddate }}-resume
          files: |
            *ATTY*.pdf
