name: build-pdf-cv_resume

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    name: Build PDF CV Resume (Typst & ConTeXt)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: "Set build metadata"
        id: version
        run: |
          echo "buildyear=$(date +'%Y')" >> $GITHUB_OUTPUT

      - name: Install Taskfile runner
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Dependencies via uv
        run: uv sync

      - name: Lint and Validate (Taskfile Lint)
        run: task lint

      - name: Compile Modern Typst Resume
        run: task lint:typst

      - name: Render Pandoc Markdown Template
        run: uv run scripts/render_resume.py

      - name: Build Legacy ConTeXt PDF with Docker
        uses: addnab/docker-run-action@v3
        with:
          image: yoyonel/pandoc:latest
          options: -v ${{ github.workspace }}:/source
          run: |
            cd /source/pandoc_resume
            make pdf

      - name: Prepare Release Artifacts
        run: |
          YEAR="${{ steps.version.outputs.buildyear }}"
          cp "data/pdf/${YEAR}/${YEAR}_ATTY_Resume_Typst.pdf" "${YEAR}_ATTY_Resume_Typst.pdf"
          cp pandoc_resume/resume.pdf "${YEAR}_ATTY_Resume_Legacy.pdf"
          cp pandoc_resume/references.pdf "${YEAR}_ATTY_References.pdf"
          ls -la *ATTY*.pdf

      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-resumes-${{ steps.version.outputs.buildyear }}
          path: "*ATTY*.pdf"

      - name: Publishing Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.buildyear }}-resume
          name: ${{ steps.version.outputs.buildyear }}-resume
          files: |
            *ATTY*.pdf
