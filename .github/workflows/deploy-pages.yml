name: deploy-github-pages

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Static Site with Typst
        run: uv run scripts/build_site.py

      - name: Verify Static HTML & Inline JS Syntax
        run: python3 scripts/check_html_syntax.py

      - name: Verify All Hyperlinks
        run: python3 scripts/check_links.py

      - name: Install Playwright Browsers
        run: uv run --with playwright playwright install --with-deps chromium

      - name: Verify Zero Runtime Console Errors
        run: uv run --with playwright scripts/check_console.py

      - name: Run Guided Exploratory Bot (Local Build)
        run: uv run --with playwright scripts/exploratory_bot.py --duration 30

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
