[project]
name = "cv-resume"
version = "0.1.0"
description = "CV & Resume generation pipelines in Typst, PDF, and interactive static HTML5/CSS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.0",
    "typst>=0.11.0",
    "playwright>=1.40.0",
    "adr-viewer>=1.4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "pyright>=1.1.370",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "E731", "UP015", "E402"]

[tool.pyright]
include = ["scripts"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
